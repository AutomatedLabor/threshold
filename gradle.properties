# JVM args for Gradle daemon. Tuned for CI (4GB+ RAM); local sandbox builds
# with constrained memory may need to reduce -Xmx.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin compile daemon
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Maven Central 429-rate-limits parallel download bursts.
# Retry harder before failing (safe — only makes resolution MORE patient).
org.gradle.internal.repository.max.tentatives=10
org.gradle.internal.repository.initial.backoff=1000
