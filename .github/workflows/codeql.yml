name: CodeQL

# Per build-contract §10 + Council iter-1 P0-14: static analysis for Kotlin + Java.
# Catches vulnerable PATTERNS (SQL injection in Room raw queries, hardcoded
# credentials, insecure crypto usage, taint flow from network to DB) —
# OSV-Scanner only catches vulnerable DEPENDENCIES.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 1'   # weekly Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Kotlin + Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Build debug APK for CodeQL extraction
        run: ./gradlew :app:assembleDebug --no-daemon -x test --stacktrace
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
